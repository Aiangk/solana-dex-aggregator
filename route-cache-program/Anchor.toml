[toolchain]
package_manager = "yarn"
anchor_version = "0.31.1"

[features]
resolution = true
skip-lint = false

[programs.devnet]
route_cache_program = "EkazNeYGJqJrMUrPyiULQjFHWuCQrohBWxX25tXjkpR"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "devnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"
update-route = "yarn ts-node scripts/updateRoute.ts"
